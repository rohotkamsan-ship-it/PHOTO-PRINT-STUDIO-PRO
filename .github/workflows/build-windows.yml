name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .

      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --hidden-import=_socket --hidden-import=socket --hidden-import=rembg --collect-submodules rembg --collect-all rembg --collect-all onnxruntime --collect-all pooch --name "PhotoPrintStudioPro" main.py

      - name: Verify packaged AI dependencies
        shell: pwsh
        run: |
          $exe = "dist/PhotoPrintStudioPro/PhotoPrintStudioPro.exe"
          if (!(Test-Path $exe)) { throw "Packaged application executable was not created: $exe" }
          $env:PHOTO_PRINT_AI_TEST_LOG = Join-Path $PWD "PhotoPrintStudioPro-ai-self-test.log"
          & $exe --self-test-ai
          $exitCode = $LASTEXITCODE
          if (Test-Path $env:PHOTO_PRINT_AI_TEST_LOG) {
            Get-Content $env:PHOTO_PRINT_AI_TEST_LOG
          }
          if ($exitCode -ne 0) {
            throw "Packaged EXE failed its rembg/ONNX Runtime smoke test (exit code $exitCode)."
          }
          Write-Host "Packaged AI dependencies verified."

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPrintStudioPro-EXE
          path: dist/PhotoPrintStudioPro/PhotoPrintStudioPro.exe
          if-no-files-found: warn

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-PRINT-STUDIO-PRO-Windows
          path: dist/PhotoPrintStudioPro/
          if-no-files-found: warn
