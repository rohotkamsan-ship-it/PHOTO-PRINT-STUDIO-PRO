name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONPATH: .

      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name "PhotoPrintStudioPro" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPrintStudioPro-EXE
          path: dist/PhotoPrintStudioPro.exe
          if-no-files-found: warn

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-PRINT-STUDIO-PRO-Windows
          path: dist/PhotoPrintStudioPro/
          if-no-files-found: warn
